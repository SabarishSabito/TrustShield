<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>TrustShield | Analyst Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.22) 0%, rgba(254, 215, 170, 0.16) 38%, rgba(255, 255, 255, 0) 72%), #FFFFFF;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .ambient-card {
      box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.07), 0 0 40px -10px rgba(249, 115, 22, 0.12);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Splash Animation Modal -->
  <div id="splashLoader" class="hidden fixed inset-0 z-50 bg-white/90 backdrop-blur-md flex flex-col items-center justify-center">
    <div class="relative flex items-center justify-center mb-5">
      <div class="absolute w-24 h-24 rounded-full bg-orange-500/20 blur-xl animate-pulse"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white text-2xl shadow-xl shadow-orange-500/30 relative z-10">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
    </div>
    <div class="text-center space-y-1.5">
      <h2 class="text-slate-900 text-lg font-bold">Trust<span class="text-orange-600">Shield</span></h2>
      <p class="text-xs mono text-orange-600 tracking-widest uppercase flex items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i> Authenticating Analyst...
      </p>
    </div>
  </div>

  <!-- Centered Login Card -->
  <div class="w-full max-w-[420px] bg-white rounded-[32px] ambient-card p-10 border border-slate-100 relative z-10">
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 text-white flex items-center justify-center text-xl shadow-lg shadow-orange-500/30 mb-4">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Trust<span class="text-orange-600">Shield</span></h1>
      <p class="text-xs text-slate-400 mt-1 font-medium">Multi-Modal Profile Forensics Intelligence</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Analyst Email / ID</label>
        <input type="email" id="officerEmail" required value="1mv1ks@gmail.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 bg-slate-50/50 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Passkey / Token</label>
        <input type="password" required value="trustshield2026" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 bg-slate-50/50 transition">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs shadow-lg shadow-orange-600/25 transition flex items-center justify-center gap-2 pt-3">
        <span>Authenticate & Access</span>
        <i class="fa-solid fa-arrow-right text-[10px]"></i>
      </button>
    </form>
    
    <div class="mt-8 text-center text-[10px] mono text-slate-400 tracking-widest uppercase border-t border-slate-100 pt-5">
      SOC-GRADE PROFILE INVESTIGATION
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('officerEmail').value || '1mv1ks@gmail.com';
      sessionStorage.setItem('moderator_email', email);
      document.getElementById('splashLoader').classList.remove('hidden');
      setTimeout(function() {
        window.location.href = '/';
      }, 1400);
    }
  </script>
</body>
</html>
