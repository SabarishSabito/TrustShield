<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Trust Shield | Analyst Console Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Typography: Manrope & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Centralized Theme Tokens -->
  <link rel="stylesheet" href="/static/css/trustshield-theme.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { DEFAULT: '#263B36', hover: '#1c2c28', light: '#324e47' },
            ivory: { DEFAULT: '#FAF7F0', dark: '#F2ECE1' },
            mint: { DEFAULT: '#BDE8D5', light: '#E4F6EE', dark: '#9FD6BD' },
            sand: { DEFAULT: '#DCCBB4', light: '#EDE3D4', dark: '#C7B298' },
            mutedSlate: '#718078',
            bodySecondary: '#52635A',
            pos: '#267653',
            warn: '#B7791F',
            danger: '#B93838',
            subtleBorder: '#E5E7E0'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Manrope', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-ivory text-forest min-h-screen flex items-center justify-center p-6 font-sans">

  <!-- Sign In Card -->
  <div class="w-full max-w-md bg-white rounded-2xl border border-subtleBorder shadow-md p-8 sm:p-10 space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-3">
      <a href="/" class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-forest text-mint shadow-sm mb-1 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </a>
      <h1 class="font-heading text-2xl font-extrabold text-forest tracking-tight">
        Sign in to Trust Shield
      </h1>
      <p class="text-xs text-bodySecondary max-w-xs mx-auto leading-relaxed">
        Access the profile risk console, moderation logs, and audit dossiers.
      </p>
    </div>

    <!-- Error Alert Box (Hidden by default) -->
    <div id="loginErrorBox" class="hidden p-3.5 rounded-xl ts-badge-danger text-xs flex items-start gap-2.5">
      <i class="fa-solid fa-circle-exclamation mt-0.5 text-danger"></i>
      <span id="loginErrorMsg">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="authLoginForm" class="space-y-4">
      <div>
        <label for="officerEmail" class="block text-xs font-semibold text-forest mb-1.5">
          Corporate / Analyst Email
        </label>
        <input 
          type="email" 
          id="officerEmail" 
          name="email"
          placeholder="analyst@trustshield.internal" 
          class="ts-input text-xs" 
          required
        >
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="officerPassword" class="text-xs font-semibold text-forest">
            Authentication Passkey
          </label>
          <span class="text-[11px] text-mutedSlate">Minimum 6 characters</span>
        </div>
        <input 
          type="password" 
          id="officerPassword" 
          name="password"
          placeholder="Enter your security passkey" 
          class="ts-input text-xs" 
          required
        >
      </div>

      <button type="submit" id="loginBtn" class="w-full ts-btn-primary py-3 text-sm">
        <span id="loginBtnText">Sign In to Console</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- Demo Notice & Back Link -->
    <div class="pt-4 border-t border-subtleBorder text-center space-y-3">
      <div class="p-3 rounded-lg bg-ivory text-left border border-sand-light text-[11px] text-bodySecondary space-y-1">
        <div class="font-semibold text-forest flex items-center gap-1.5">
          <i class="fa-solid fa-circle-info text-pos"></i>
          <span>Environment Notice</span>
        </div>
        <p>
          Local analyst authentication accepts any valid email format and password with 6+ characters.
        </p>
      </div>

      <div>
        <a href="/" class="text-xs font-semibold text-bodySecondary hover:text-forest transition">
          &larr; Return to Overview
        </a>
      </div>
    </div>

  </div>

  <!-- Real Authentication Script -->
  <script>
    document.getElementById('authLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('officerEmail').value.trim();
      const password = document.getElementById('officerPassword').value.trim();
      const errorBox = document.getElementById('loginErrorBox');
      const errorMsg = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');

      errorBox.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = "Verifying...";

      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Authentication failed. Check your credentials.");
        }

        // Store active session profile
        sessionStorage.setItem('trustshield_user', JSON.stringify(data));
        btnText.textContent = "Authorized. Redirecting...";
        
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);

      } catch (err) {
        errorMsg.textContent = err.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = "Sign In to Console";
      }
    });
  </script>
</body>
</html>
